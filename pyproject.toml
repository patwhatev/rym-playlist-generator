[project]
name = "rymlist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrick", email = "everman.patrick@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "lxml>=6.1.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "spotipy>=2.26.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
rymlist = "rymlist:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
